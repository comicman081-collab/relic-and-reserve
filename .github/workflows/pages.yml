name: Build and Deploy Godot Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  NANUM_GOTHIC_COMMIT: "6a003b5eb672dc8bf5bff5937cf5863f8b175445"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Prepare bundled Korean web font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/${NANUM_GOTHIC_COMMIT}/ofl/nanumgothic/NanumGothic-Regular.ttf" \
            --output assets/fonts/NanumGothic-Regular.ttf
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/${NANUM_GOTHIC_COMMIT}/ofl/nanumgothic/OFL.txt" \
            --output assets/fonts/NanumGothic-OFL.txt

          python3 - <<'PY'
          from pathlib import Path

          project = Path("project.godot")
          text = project.read_text(encoding="utf-8")
          setting = 'theme/custom_font="res://assets/fonts/NanumGothic-Regular.ttf"'

          if setting not in text:
              if "[gui]" in text:
                  text = text.replace("[gui]\n", f"[gui]\n\n{setting}\n", 1)
              else:
                  marker = "\n[rendering]\n"
                  if marker not in text:
                      raise SystemExit("project.godot has no [rendering] marker for GUI font injection")
                  text = text.replace(marker, f"\n[gui]\n\n{setting}\n{marker}", 1)
              project.write_text(text, encoding="utf-8")
          PY

          test -s assets/fonts/NanumGothic-Regular.ttf
          test -s assets/fonts/NanumGothic-OFL.txt
          grep -Fq 'theme/custom_font="res://assets/fonts/NanumGothic-Regular.ttf"' project.godot

      - name: Verify mobile presentation and audio assets
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MobileWebLayout="*res://scripts/mobile_web_layout.gd"' project.godot
          grep -Fq 'window/stretch/mode="canvas_items"' project.godot
          grep -Fq 'window/stretch/aspect="expand"' project.godot
          grep -Fq 'interface.resized' scripts/mobile_web_layout.gd
          test -s scripts/mobile_web_layout.gd
          test -s audio/ui_click.wav
          test -s audio/title/relic_reserve_title/01_first_bell_sunshine.mp3
          for track in \
            001_morning_hallway.mp3 \
            002_lunch_break_laughs.mp3 \
            005_library_sunbeams.mp3 \
            007_festival_lanterns.mp3 \
            008_exam_night_window.mp3 \
            010_graduation_rehearsal.mp3; do
            test -s "audio/bgm/relic_reserve_bgm/${track}"
          done
          for track in \
            01_see_you_tomorrow.mp3 \
            02_the_memory_we_keep.mp3 \
            03_after_the_final_bell.mp3 \
            04_summer_never_ends.mp3 \
            05_our_next_adventure.mp3 \
            06_the_sky_is_still_blue.mp3; do
            test -s "audio/endings/relic_reserve_endings/${track}"
          done
          echo "Portrait stretch settings, mobile layout bridge, click SFX, screen BGM, and ending BGM assets are present."

      - name: Verify 390x700 portrait runtime geometry
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import > /tmp/relic-import.log 2>&1 || {
            cat /tmp/relic-import.log
            exit 1
          }

          set +e
          godot --headless --path . --resolution 390x700 --script tests/mobile_portrait_runtime_tests.gd 2>&1 | tee /tmp/relic-mobile-runtime.log
          runtime_status=${PIPESTATUS[0]}
          set -e

          if [ "$runtime_status" -ne 0 ]; then
            echo "Portrait runtime exited with status ${runtime_status}."
            exit "$runtime_status"
          fi
          if grep -Eq 'SCRIPT ERROR:|Invalid access to property or key' /tmp/relic-mobile-runtime.log; then
            echo "Portrait runtime emitted a GDScript error; refusing a false PASS."
            exit 1
          fi
          grep -Fq 'MOBILE_PORTRAIT_RUNTIME_QA: PASS' /tmp/relic-mobile-runtime.log

      - name: Import resources and export Web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web-build
          mkdir -p web-build

          WEB_BASE="relic-${GITHUB_SHA:0:12}"
          echo "WEB_BASE=${WEB_BASE}" >> "$GITHUB_ENV"

          godot --headless --path . --import
          godot --headless --path . --export-release "Web" "web-build/${WEB_BASE}.html"

          # Keep the public entry point stable while every heavy Godot asset gets
          # a commit-specific filename. Mobile browsers therefore cannot reuse an
          # older cached .pck/.wasm after a new deployment.
          cp "web-build/${WEB_BASE}.html" web-build/index.html
          rm "web-build/${WEB_BASE}.html"

          touch web-build/.nojekyll
          cp assets/fonts/NanumGothic-OFL.txt web-build/NanumGothic-OFL.txt

      - name: Verify Web export
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -s web-build/index.html
          test -s "web-build/${WEB_BASE}.js"
          test -s "web-build/${WEB_BASE}.pck"
          test -s "web-build/${WEB_BASE}.wasm"
          test -s web-build/NanumGothic-OFL.txt
          grep -Fq '<meta charset="utf-8">' web-build/index.html
          grep -Fq "src=\"${WEB_BASE}.js\"" web-build/index.html
          grep -Fq "\"executable\":\"${WEB_BASE}\"" web-build/index.html
          grep -Fq "\"${WEB_BASE}.pck\"" web-build/index.html
          grep -Fq "\"${WEB_BASE}.wasm\"" web-build/index.html
          test ! -e web-build/index.pck
          test ! -e web-build/index.wasm
          echo "Web export contains Korean font support, responsive portrait settings, audio assets, and commit-versioned Godot assets."

      - name: Capture and verify real 390x700 Web portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-web
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser is available on the runner."
            exit 1
          fi

          python3 -m http.server 8765 --bind 127.0.0.1 --directory web-build > /tmp/relic-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/relic-web-server.log
            exit 1
          fi

          # Give the large Godot package more time than the previous 120s budget.
          # The screenshot is validated below, so a loader image cannot pass just
          # because Chrome produced a PNG file.
          timeout 280s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --window-size=390,700 \
            --virtual-time-budget=240000 \
            --screenshot=qa-web/mobile-390x700.png \
            "http://127.0.0.1:8765/?qa=${GITHUB_SHA}"

          test -s qa-web/mobile-390x700.png
          file qa-web/mobile-390x700.png

          # Decode the PNG with the Python standard library only. A real title
          # screen contains the gold RELIC & RESERVE title and no large Godot-blue
          # progress bar. The old false-positive loader screenshot had 0 gold
          # pixels and thousands of blue progress-bar pixels.
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          path = Path("qa-web/mobile-390x700.png")
          data = path.read_bytes()
          signature = b"\x89PNG\r\n\x1a\n"
          if not data.startswith(signature):
              raise SystemExit("Web smoke screenshot is not a PNG")

          pos = len(signature)
          width = height = bit_depth = color_type = interlace = None
          compressed = bytearray()
          while pos + 12 <= len(data):
              length = struct.unpack(">I", data[pos:pos + 4])[0]
              kind = data[pos + 4:pos + 8]
              payload = data[pos + 8:pos + 8 + length]
              pos += 12 + length
              if kind == b"IHDR":
                  width, height, bit_depth, color_type, _comp, _filter, interlace = struct.unpack(">IIBBBBB", payload)
              elif kind == b"IDAT":
                  compressed.extend(payload)
              elif kind == b"IEND":
                  break

          if (width, height) != (390, 700):
              raise SystemExit(f"Unexpected Web smoke size: {width}x{height}")
          if bit_depth != 8 or color_type not in (2, 6) or interlace != 0:
              raise SystemExit(f"Unsupported PNG format bit_depth={bit_depth} color_type={color_type} interlace={interlace}")

          channels = 3 if color_type == 2 else 4
          stride = width * channels
          raw = zlib.decompress(bytes(compressed))
          expected = height * (stride + 1)
          if len(raw) != expected:
              raise SystemExit(f"Unexpected decompressed PNG size: {len(raw)} != {expected}")

          def paeth(a, b, c):
              p = a + b - c
              pa = abs(p - a)
              pb = abs(p - b)
              pc = abs(p - c)
              if pa <= pb and pa <= pc:
                  return a
              if pb <= pc:
                  return b
              return c

          previous = bytearray(stride)
          gold = 0
          loader_blue = 0
          offset = 0
          for _y in range(height):
              filter_type = raw[offset]
              offset += 1
              scan = bytearray(raw[offset:offset + stride])
              offset += stride
              for i in range(stride):
                  left = scan[i - channels] if i >= channels else 0
                  up = previous[i]
                  up_left = previous[i - channels] if i >= channels else 0
                  if filter_type == 1:
                      scan[i] = (scan[i] + left) & 0xFF
                  elif filter_type == 2:
                      scan[i] = (scan[i] + up) & 0xFF
                  elif filter_type == 3:
                      scan[i] = (scan[i] + ((left + up) >> 1)) & 0xFF
                  elif filter_type == 4:
                      scan[i] = (scan[i] + paeth(left, up, up_left)) & 0xFF
                  elif filter_type != 0:
                      raise SystemExit(f"Unsupported PNG filter {filter_type}")

              for x in range(width):
                  base = x * channels
                  r, g, b = scan[base], scan[base + 1], scan[base + 2]
                  if r >= 150 and 105 <= g <= 220 and b <= 140 and r >= int(g * 0.9):
                      gold += 1
                  if b >= 150 and g >= 70 and r <= 120 and b >= int(r * 1.5):
                      loader_blue += 1
              previous = scan

          print(f"WEB_PORTRAIT_PIXEL_QA gold={gold} loader_blue={loader_blue}")
          if gold < 500:
              raise SystemExit("Real title screen not detected: insufficient gold title pixels")
          if loader_blue > 1500:
              raise SystemExit("Godot loader/progress bar still dominates the screenshot")
          print("WEB_PORTRAIT_PIXEL_QA: PASS")
          PY

      - name: Upload portrait Web smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-portrait-web-smoke-${{ github.sha }}
          path: qa-web/mobile-390x700.png
          if-no-files-found: error
          retention-days: 2

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Web export for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
